[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudra-native"
version = "0.1.0"
description = "Cloudra's bundled Android native service bridge"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["cloudra_native*", "flutter*"]

[tool.setuptools.package-data]
"flutter.cloudra_native" = [
    "pubspec.yaml",
    "lib/*.dart",
    "lib/src/*.dart",
    "android/*.gradle",
    "android/src/main/*.xml",
    "android/src/main/kotlin/io/github/yyywaa/cloudra_native/*.kt",
]
