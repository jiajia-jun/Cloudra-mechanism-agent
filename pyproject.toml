[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudra"
version = "2.0.0-beta"
description = "面向化学科研的 AI Agent 协作框架"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cloudra Team"}
]
keywords = ["ai", "agent", "chemistry", "research", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "textual>=0.85.0",
    "platformdirs>=3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "arxiv>=1.4",
    "httpx>=0.24",
    "certifi>=2024",
    "python-frontmatter>=1.0",
    "ase>=3.28.0",
    "cclib>=1.8.1",
    "aiosqlite>=0.20",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gui = [
    "flet[desktop]>=0.86,<0.87",
]
chem = [
    "rdkit>=2023.0",
    "nmrglue>=0.10",
    "spectrochempy>=0.6.0",
    "chemcoord>=2.1.2",
]
browser = [
    "playwright>=1.40",
]
pdf = [
    "pymupdf>=1.24.0",
]
all = [
    "rdkit>=2023.0",
    "nmrglue>=0.10",
    "spectrochempy>=0.6.0",
    "chemcoord>=2.1.2",
    "playwright>=1.40",
    "pymupdf>=1.24.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20",
    "pytest-cov>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
cloudra = "cloudra.cli:main"
cloudra-api = "cloudra.api:main"

[project.urls]
Homepage = "https://github.com/yyywaa/Cloudra-an-ai-agent-for-chemists"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudra*"]
exclude = ["tests*", "test_*"]

# 运行时必需的非 Python 资源：prompts、技能文档、计算脚本。
# 缺失时 pip 安装的包会在 _load_prompt / skill_loader 处报 FileNotFoundError。
[tool.setuptools.package-data]
cloudra = ["prompts/*.md", "skills/**/*", "calculator.sh"]

[tool.flet]
org = "io.github.yyywaa"
product = "Cloudra"
company = "Cloudra"
bundle_id = "io.github.yyywaa.cloudra"

[tool.flet.app]
module = "flet_app"
path = "."
exclude = [
    ".env",
    "*.env",
    ".git",
    ".github",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    "benchmarks",
    "build",
    "copyright_docs",
    "exam_*",
    "frontend",
    "paper",
    "tests",
    "软著申请材料",
]

[tool.flet.android]
dependencies = ["flet>=0.86,<0.87"]
target_arch = ["arm64-v8a"]
split_per_abi = false

[tool.flet.android.manifest_application]
# Custom OpenAI-compatible endpoints are sometimes plain HTTP on a LAN.
usesCleartextTraffic = "true"

[tool.flet.android.permission]
"android.permission.INTERNET" = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
