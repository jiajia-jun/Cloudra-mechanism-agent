[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudra"
version = "1.0.0"
description = "面向化学科研的 AI Agent 协作框架"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cloudra Team"}
]
keywords = ["ai", "agent", "chemistry", "research", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "platformdirs>=3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "arxiv>=1.4",
    "httpx>=0.24",
    "rdkit>=2023.0",
    "python-frontmatter>=1.0",
]

[project.scripts]
cloudra = "cloudra.cli:main"

[project.urls]
Homepage = "https://github.com/cloudra/agent4chem"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudra*"]
exclude = ["tests*", "test_*"]
