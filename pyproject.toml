[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudra"
version = "1.8.0"
description = "面向化学科研的 AI Agent 协作框架"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cloudra Team"}
]
keywords = ["ai", "agent", "chemistry", "research", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "platformdirs>=3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "arxiv>=1.4",
    "httpx>=0.24",
    "rdkit>=2023.0",
    "python-frontmatter>=1.0",
    "nmrglue>=0.10",
    "spectrochempy>=0.6.0",
    "playwright>=1.40",
    "ase>=3.28.0",
    "cclib>=1.8.1",
    "aiosqlite>=0.20",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "chemcoord>=2.1.2",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20",
    "pytest-cov>=4.0",
]

[project.scripts]
cloudra = "cloudra.cli:main"
cloudra-api = "cloudra.api:main"

[project.urls]
Homepage = "https://github.com/yyywaa/Cloudra-an-ai-agent-for-chemists"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudra*"]
exclude = ["tests*", "test_*"]

# 运行时必需的非 Python 资源：prompts、技能文档、计算脚本。
# 缺失时 pip 安装的包会在 _load_prompt / skill_loader 处报 FileNotFoundError。
[tool.setuptools.package-data]
cloudra = ["prompts/*.md", "skills/**/*", "calculator.sh"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
