<!doctype html>
<html lang="zh-CN" data-appearance="acid">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Molecular workbench browser test</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';
      import { MolecularWorkbench } from '/src/MolecularWorkbench.tsx';
      import { PROJECT_ACTIVE } from './fixtures.ts';
      import '/src/styles.css';
      import '/src/appearance.css';

      const probe = {};
      if (location.search === '?capture') {
        const { GLViewer } = await import('3dmol/build/3Dmol.es6-min.js');
        const render = GLViewer.prototype.render;
        GLViewer.prototype.render = function(...args) {
          window.testViewer = this;
          return render.apply(this,args);
        };
        probe.onLaunch = async shot => {
          const { image } = await shot.capture;
          const bitmap = await createImageBitmap(image);
          const canvas = document.createElement('canvas');
          canvas.width=bitmap.width; canvas.height=bitmap.height;
          const ctx=canvas.getContext('2d');
          ctx.drawImage(bitmap,0,0); bitmap.close();
          (window.testShots ??= []).push({snapshot:shot.snapshot, pixels:ctx.getImageData(0,0,canvas.width,canvas.height).data});
        };
      }
      createRoot(document.getElementById('root')).render(createElement(MolecularWorkbench, {
        ...probe, project: PROJECT_ACTIVE,
        source: null,
        onClose() {},
        onSaved() {},
        onError() {},
      }));
    </script>
  </body>
</html>
