自旋态的天然对照，同 D4 模式）。", "verify": "约", "def": null, "raw": "### I5. 单线态亚氨基 NH(a¹Δ) + H2 → NH3 插入（Singlet imidogen insertion）\n1. **体系**：NH(a ¹Δ) + H2 → NH3 插入反应。\n2. **结构**：`[NH]` + `[H][H]`；总单线态。\n3. **多参考性质**：NH(a¹Δ) 与 O2(¹Δg) 同构（π² 组态的两种占据严格简并），反应物态本身需双行列式；单线态面经 C2v 插入深 NH3 势阱（放热 >100 kcal/mol [约]），而三态面 NH(X³Σ⁻)+H2 抽提有高垒——自旋态决定机理，单参考方法连反应物都无法正确表示。\n4. **诊断证据**：NH(a¹Δ) 淬灭/反应动力学 Bohn & Stuhl, J. Phys. Chem. 97, 7234 (1993)（v 态分辨淬灭速率 [约]，HERO 数据库收录）；三态对照面 N(⁴S)+H2 ⇌ NH(X³Σ⁻)+H 高精度 PES Poveda & Varandas, PCCP 7, 2867 (2005)；NH a¹Δ–X³Σ⁻ 能隙 Te ≈ 1.56 eV（Huber & Herzberg [约]）；¹Δ 双组态本质同 C1（¹O2）。\n5. **兄弟题**：NH(X³Σ⁻) + H2 → NH2 + H 氢抽提——UKS 三态单参考可算（同反应物不同自旋态的天然对照，同 D4 模式）。\n6. **权威性依据**：¹Δ 双自由基oid 双原子反应性的教科书案例；与 O(¹D)+H2（I3）构成\"原子版 vs 双原子版\"姊妹题。\n7. **拒答判据**：识别 ¹Δ 反应物无单行列式表示（RKS 会把 ¹Δ 与 ¹Σ⁺ 混成平均）；拒绝对单线态插入速率/能垒报单参考数；指明 CASSCF(活性空间含 NH π 体系）+MRCI/CASPT2。"}, {"id": "I6", "family": "I", "familyName": "反常键与原子/小分子插入化学", "name": "NH / NF / NCl / SO 的 a¹Δ–X³Σ⁻ 能隙（¹Δ 等电子族）", "edge": "", "smiles": "[NH] / FN / ClN / NCl / S=O", "mr": "π*²（或 NH 的 π²）两个电子的两种占据严格简并——¹Δ 在任何单行列式框架内不存在；RKS-DFT 把 ¹Δ 与 ¹Σ⁺ 混为对称破缺平均，系统性低估能隙；该族把 C1（¹O2）的\"最小自旋态测试\"推广到异核/含氢双原子。", "sibling": "各分子 X³Σ⁻ 基态的键长、振动频率与解离能——UKS/UCCSD(T) 单参考可算（同 C1 兄弟题模式）。", "verify": "未核实", "def": null, "raw": "### I6. NH / NF / NCl / SO 的 a¹Δ–X³Σ⁻ 能隙（¹Δ 等电子族）\n1. **体系**：O2 ¹Δ 问题的等电子双原子族：NH、NF、NCl、SO 的 a¹Δ 与 b¹Σ⁺ 激发能。\n2. **结构**：SMILES `[NH]` / `FN` / `ClN`（可写作 `NCl`）/ `S=O`；X ³Σ⁻ / a ¹Δ / b ¹Σ⁺。\n3. **多参考性质**：π*²（或 NH 的 π²）两个电子的两种占据严格简并——¹Δ 在任何单行列式框架内不存在；RKS-DFT 把 ¹Δ 与 ¹Σ⁺ 混为对称破缺平均，系统性低估能隙；该族把 C1（¹O2）的\"最小自旋态测试\"推广到异核/含氢双原子。\n4. **诊断证据**：NH a¹Δ Te ≈ 1.56 eV（Huber & Herzberg [约]）；NF a¹Δ ≈ 1.19 eV [约][未核实精确值]；SO a¹Δ ≈ 0.79 eV（~6350 cm⁻¹ [约]）；NCl(a¹Δ) 作为全气相碘激光储能粒子（I(²P1/2) 能级转移实验：Tang et al., Appl. Opt. 45, 7126 (2006)，PubMed 16946792）；NF a¹Δ 偶极矩实验-理论对照 Harbison et al., 2002（PubMed 11792193）；¹Δg O2 激发能 0.977 eV 作族内锚点（教科书常数，同 C1）。\n5. **兄弟题**：各分子 X³Σ⁻ 基态的键长、振动频率与解离能——UKS/UCCSD(T) 单参考可算（同 C1 兄弟题模式）。\n6. **权威性依据**：¹Δ 储能粒子是化学激光（COIL/AGIL）物理的核心；Huber & Herzberg 常数表为实验金标准。\n7. **拒答判据**：识别 ¹Δ 需两组态（或自旋对称适配）；指出 RKS/RHF 单参考会把 ¹Δ/¹Σ⁺ 混成平均能；只答三态基态性质、拒答单参考 ¹Δ 能隙。"}, {"id": "I7", "family": "I", "familyName": "反常键与原子/小分子插入化学", "name": "硅宾/锗宾 SiH2、GeH2 单三态能隙与 H2 插入（Silylene/germylene）", "edge": "", "smiles": "[SiH2] / [GeH2]", "mr": "卡宾重同族物——单线态 ¹A1 为 σ²(3p)/π²（sp² 孤对 vs p 空轨道）组态混合，与 ¹CH2 同型但更重；RHF 系统性高估单三态能隙，(T) 诊断超闭壳层阈值；插入反应坐标上 σ 给体/π 受体协同成键使波函数双组态化，RHF 给出人为偏高的插入垒。", "sibling": "³B1 SiH2/GeH2 三态几何与振动频率——UKS 单参考可算；或 SiF2 能隙（σ 给体/π 受体氟取代使能隙大、单线态闭壳层主导，CCSD(T) 可算，类比 C2 的 CF2 兄弟题）[约]。", "verify": "未核实", "def": null, "raw": "### I7. 硅宾/锗宾 SiH2、GeH2 单三态能隙与 H2 插入（Silylene/germylene）\n1. **体系**：SiH2、GeH2 的 ¹A1–³B1 能隙，及 ¹EH2 + H2 → EH4 插入反应（E=Si, Ge）。\n2. **结构**：SMILES `[SiH2]` / `[GeH2]`；¹A1 基态（与 CH2 相反，单线态在下）。\n3. **多参考性质**：卡宾重同族物——单线态 ¹A1 为 σ²(3p)/π²（sp² 孤对 vs p 空轨道）组态混合，与 ¹CH2 同型但更重；RHF 系统性高估单三态能隙，(T) 诊断超闭壳层阈值；插入反应坐标上 σ 给体/π 受体协同成键使波函数双组态化，RHF 给出人为偏高的插入垒。\n4. **诊断证据**：ΔE_ST(SiH2) ≈ 21 kcal/mol（单线态基态；实验值经 Berkowitz et al., JCP, 1987 [未核实卷页] 确立，理论 Balasubramanian & McLean [约]）；ΔE_ST(GeH2) ≈ 22–23 kcal/mol [约]；插入垒 ¹SiH2+H2→SiH4 ≈ 1.7 kcal/mol（高精度理论值，经 Schlegel 组氟代硅烷分解研究引用，wayne.edu Pub 139）；¹GeH2+H2 垒 58(56) kJ/mol vs ¹SiH2 13(6) kJ/mol（Becerra et al., Can. J. Chem. 78 (2000)，被引 46）；T1(¹A1 SiH2) ≈ 0.03 [约][未核实]。\n5. **兄弟题**：³B1 SiH2/GeH2 三态几何与振动频率——UKS 单参考可算；或 SiF2 能隙（σ 给体/π 受体氟取代使能隙大、单线态闭壳层主导，CCSD(T) 可算，类比 C2 的 CF2 兄弟题）[约]。\n6. **权威性依据**：主族卡宾类似物化学（Gaspar/Becerra/Walsh 动力学学派 + Schlegel/Gordon 理论学派）；半导体 CVD 机理的基础物种。\n7. **拒答判据**：查 T1 发现 ¹A1 超阈；识别 σ²/π² 组态混合（同 ¹CH2 判据的重同族推广）；拒报 RHF/RKS 单参考能隙与插入垒；指出需 CASSCF(2,2)+动态关联。"}, {"id": "I8", "family": "I", "familyName": "反常键与原子/小分子插入化学", "name": "磷宾 HP 的单线态问题（Phosphinidene）", "edge": "边缘候选", "smiles": "[PH]", "mr": "氮宾/卡宾的磷同族物——三线态基态高出单线态 20–28 kcal/mol；单线态虽为闭壳层，但 σ²/p² 组态混合使 RHF 参考质量差（同 ¹CH2 判据）。**边缘原因**：与 C3（苯基氮烯开壳单线态）不同，HP 单线态是闭壳层，MR 强度较弱；本题主要考核 agent 能否正确迁移\"卡宾/氮宾判据\"到磷族而非机械拒答。", "sibling": "³HP/³PhP 三态基态几何与性质——UKS 单参考可算；或 HCP（磷杂乙炔，SMILES `C#P`）闭壳层基态热化学。", "verify": "已核实", "def": "pick", "raw": "### I8. 磷宾 HP 的单线态问题（Phosphinidene）【边缘候选】\n1. **体系**：母体磷宾 H–P（及 PhP）的单线态-三线态能隙。\n2. **结构**：SMILES `[PH]`；³Σ⁻（或 ³A''）基态，闭壳层单线态为激发态。\n3. **多参考性质**：氮宾/卡宾的磷同族物——三线态基态高出单线态 20–28 kcal/mol；单线态虽为闭壳层，但 σ²/p² 组态混合使 RHF 参考质量差（同 ¹CH2 判据）。**边缘原因**：与 C3（苯基氮烯开壳单线态）不同，HP 单线态是闭壳层，MR 强度较弱；本题主要考核 agent 能否正确迁移\"卡宾/氮宾判据\"到磷族而非机械拒答。\n4. **诊断证据**：母体 PH 三态基态、单线态高出 ~28 kcal/mol（Nguyen et al., JOC 1996，DOI 10.1021/jo9604393，被引 119，\"In Search of Singlet Phosphinidenes\"）；室温稳定单线态磷宾综述与母体数据复述（Liu et al., Chem 2016，被引 331，\"A Singlet Phosphinidene Stable at Room Temperature\"：母体 20–28 kcal/mol）；ΔE_ST ≈ 22 kcal/mol（Lu et al., Chem. Eur. J. 2023 综述，DOI 10.1002/chem.202303283）。\n5. **兄弟题**：³HP/³PhP 三态基态几何与性质——UKS 单参考可算；或 HCP（磷杂乙炔，SMILES `C#P`）闭壳层基态热化学。\n6. **权威性依据**：Nguyen 学派的磷宾电子结构经典 + Bertrand/Lammertsma 稳定化磷宾实验链。\n7. **拒答判据**：识别单线态磷宾的组态混合并给出\"中等 MR\"的定量分级（区别于 TMM/苯炔级强 MR）；三态用 UKS 正常作答——考核分级拒答而非一刀切。"}, {"id": "J1", "family": "J", "familyName": "卡宾/氮烯/硅烯重排与小势能面", "name": "乙烯基卡宾 ⇌ 环丙烯重排（Vinylcarbene–cyclopropene rearrangement）", "edge": "", "smiles": "C=C[CH] / C1=CC1", "mr": "开环/闭环 TS 为环丙烯 C–C σ 键断裂形成的\"双自由基 ⇌ 卡宾\"二象性中间体；卡宾 HOMO/LUMO 近简并（Mazziotti 组 ACSE 论文摘要原话：\"卡宾计算必须考虑多参考关联，因为 HOMO 与 LUMO 可近能量简并\"）；TS 兼具三元环反芳香oid 特征。", "sibling": "环丙烯基态应变能、氢化热与热化学（闭壳层三元环，CCSD(T) 可算）；三态乙烯基卡宾（UKS 可算）。", "verify": "约", "def": null, "raw": "### J1. 乙烯基卡宾 ⇌ 环丙烯重排（Vinylcarbene–cyclopropene rearrangement）\n1. **体系**：C3H4 势能面上的单线态乙烯基卡宾（vinylcarbene）⇌ 环丙烯（cyclopropene）——卡宾化学的经典互变，也是丙二烯 ⇌ 丙炔异构化的中间通道。\n2. **结构**：乙烯基卡宾 SMILES `C=C[CH]`（¹A′，卡宾碳 σ² 孤对 + 空 pπ 与乙烯基 π 共轭）；环丙烯 SMILES `C1=CC1`（¹A1）；单线态。\n3. **多参考性质**：开环/闭环 TS 为环丙烯 C–C σ 键断裂形成的\"双自由基 ⇌ 卡宾\"二象性中间体；卡宾 HOMO/LUMO 近简并（Mazziotti 组 ACSE 论文摘要原话：\"卡宾计算必须考虑多参考关联，因为 HOMO 与 LUMO 可近能量简并\"）；TS 兼具三元环反芳香oid 特征。\n4. **诊断证据**：实验上 1,3-二乙基环丙烯**外消旋比结构异构快约 10 倍**但活化参数几乎相同（log k_rac = 11.8 − 32600/2.3RT；log k_struct = 10.4 − 32300/2.3RT），指向可逆开环的 biradical/carbene 中间体 [约，教科书章节经 ScienceDirect Topics 核实]；单线态乙烯基卡宾实验 ΔHf ≈ 104 kcal/mol vs 环丙烯 66 kcal/mol [约，同来源]；Greenman & Mazziotti, 2010, J. Phys. Chem. A 114, 583–588（ACSE 计算卡宾反应能垒，明示 MR 必要性）；C3H4 全面 PES 研究确认 allene⇌propyne 走 vinylcarbene–cyclopropene 通道（Gu, Guo, Kaiser 等，被引 59 [约]）。\n5. **兄弟题**：环丙烯基态应变能、氢化热与热化学（闭壳层三元环，CCSD(T) 可算）；三态乙烯基卡宾（UKS 可算）。\n6. **权威性依据**：环丙烯热化学（racemization vs 异构的经典物理有机实验）+ 星际 C3H4 化学 + Mazziotti 2-RDM 方法学的标志性应用对象。\n7. **拒答判据**：识别开环 TS 的双自由基/卡宾二象性与卡宾近简并；指出 RHF/RKS 单参考对\"外消旋 vs 结构异构速率比\"与开环能垒不可靠；需 CASSCF(4,4)+CASPT2 级。"}, {"id": "J2", "family": "J", "familyName": "卡宾/氮烯/硅烯重排与小势能面", "name": "亚乙烯基 ⇌ 乙炔异构化（Vinylidene–acetylene isomerization）", "edge": "", "smiles": "C=[C] / C#C", "mr": "单线态卡宾的 σ² vs π² 组态混合；异构化能垒仅 ~0.1 eV，落在静态/动态关联平衡极敏感区——半世纪的方法收敛史本身就是一部\"电子关联处理史\"（RHF 级别下势垒形貌定性错误，浅阱甚至不存在）。", "sibling": "乙炔平衡区键能、键长、频率与原子化能（同一 PES 的乙炔阱底，CCSD(T)/CBS 高精度可算）。", "verify": "约", "def": null, "raw": "### J2. 亚乙烯基 ⇌ 乙炔异构化（Vinylidene–acetylene isomerization）\n1. **体系**：C2H2：H2C=C: ⇌ HC≡CH——最小不饱和卡宾的 1,2-H 迁移，被 Science 2017 称为该反应类型的\"prototypical example\"。\n2. **结构**：亚乙烯基 SMILES `C=[C]`（X̃ ¹A1）；乙炔 SMILES `C#C`（¹Σg⁺）；单线态。\n3. **多参考性质**：单线态卡宾的 σ² vs π² 组态混合；异构化能垒仅 ~0.1 eV，落在静态/动态关联平衡极敏感区——半世纪的方法收敛史本身就是一部\"电子关联处理史\"（RHF 级别下势垒形貌定性错误，浅阱甚至不存在）。\n4. **诊断证据**：1981 年两篇原始经典——Krishnan, Frisch, Pople & Schleyer, Chem. Phys. Lett. 79, 408–411（\"The vinylidene-acetylene isomerization barrier\"）；Osamura, Schaefer, Gray & Miller, JACS 103, 1904–1907（\"a very shallow minimum\"）；Gallo, Hamilton & Schaefer, JACS 1990, 112（\"Vinylidene: the final chapter?\"，标题即反映争议史）[页码约]；Chang, Shen & Yu, JCP 1997, 106, 3237（extended ab initio）；CASSCF(10,10) 直接动力学 Hayes, Fattal, Govind & Carter, JACS 2001, 123, 641（\"Long live vinylidene!\"，被引 105）；现代共识能垒 **~0.1 eV ≈ 2–3 kcal/mol**（DeVine et al., Science 2017, 358, 336–339 正文明写，基于 Carrington et al., JCP 1984, 80, 4347 与 Han, Li & Guo, JCP 2014, 141, 244312 光谱级全维 PES）；异构能 vinylidene 高于乙炔 ≈ 2.0 eV ≈ 46 kcal/mol [约]（Ervin, Ho & Lineberger, JCP 1989, 91, 5974–5992；高精度再估 Lee, Baraban, Field & Stanton, JPCA 2013, 117, 11679）。\n5. **兄弟题**：乙炔平衡区键能、键长、频率与原子化能（同一 PES 的乙炔阱底，CCSD(T)/CBS 高精度可算）。\n6. **权威性依据**：1,2-H 迁移原型反应；Schaefer/Miller/Bowman/Guo/Field/Neumark 五个学派五十年理论-实验拉锯，证据链从 JCP 1984 连续到 Science 2017。\n7. **拒答判据**：识别单线态卡宾双组态；指出 ~2 kcal/mol 能垒低于单参考方法的系统不确定度，且低级别理论下势垒定性错误；需 CASSCF+动态关联或高精度复合方案 + 核量子效应（隧穿混合）；不应报一个无置信度声明的单参考能垒。"}, {"id": "J3", "family": "J", "familyName": "卡宾/氮烯/硅烯重排与小势能面", "name": "C3H2 三异构体相对能与互变（Cyclopropenylidene / propadienylidene / propargylene）", "edge": "", "smiles": "C1=C[C]1 / C=C=[C] / [CH]C#C", "mr": "单线态 propargylene 是 1,3-双自由基 ⇌ 定域卡宾两种电子结构的近简并混合（THEOCHEM 综述明文讨论两种备选结构）；ã ¹A′ 准线性（弯曲势极平），与 X̃ ³B 仅差 ~2 kcal/mol；异构体互变 TS 开壳。", "sibling": "c-C3H2 单线态基态结构、转动常数与偶极矩（闭壳层芳香 NHC，CCSD(T) 高精度可算——正是星际证认的依据）——同一 PES 上\"算能算的部分、拒不能算的部分\"。", "verify": "约", "def": null, "raw": "### J3. C3H2 三异构体相对能与互变（Cyclopropenylidene / propadienylidene / propargylene）\n1. **体系**：C3H2 单线态/三线态势能面：环丙烯亚基（c-C3H2，X̃ ¹A1，全局极小）⇌ 丙二烯亚基（即亚乙烯基卡宾 H2CCC，¹A1）⇌ 丙炔亚基（HCCCH，X̃ ³B 为三线态全局极小，单线态 ã ¹A′ 准线性）。\n2. **结构**：c-C3H2 SMILES `C1=C[C]1`；H2CCC SMILES `C=C=[C]`；HCCCH SMILES `[CH]C#C`（卡宾 ⇌ 1,3-双自由基共振）；单线态/三线态并存。\n3. **多参考性质**：单线态 propargylene 是 1,3-双自由基 ⇌ 定域卡宾两种电子结构的近简并混合（THEOCHEM 综述明文讨论两种备选结构）；ã ¹A′ 准线性（弯曲势极平），与 X̃ ³B 仅差 ~2 kcal/mol；异构体互变 TS 开壳。\n4. **诊断证据**：实验 ΔE_ST(propargylene) ≈ 2.0 kcal/mol（ã ¹A′ Te ≈ 0.09 eV）[约]（Osborn, Vogelhuber, …, McMahon, Stanton, Harding, Ruscic & Lineberger, JACS 2014, 136, 10361–10372，负离子 PES + 理论联合，被引 27）；单线态 propadienylidene 位于 c-C3H2 之上 10–14 kcal/mol [约]（\"Singlet and triplet potential energy surfaces of C3H2\"，J. Mol. Struct. THEOCHEM，S0166128007004228）；三线态 PES 全局极小为 propargylene X̃ ³B（Kaiser 组 1997 三线态 C3H2 ab initio PES，被引 93 [约]）；CCSD(T)/CBS 级 IE/ΔHf：Lau & Ng, Chin. J. Chem. Phys. 2006, 19, 29（DOI 10.1360/cjcp2006.19(1).29）；c-C3H2 为首个星际探测的环状有机分子、大 ST 能隙 NHC 型 2π 芳香（Lavallo et al., 2006 综述，被引 313）。\n5. **兄弟题**：c-C3H2 单线态基态结构、转动常数与偶极矩（闭壳层芳香 NHC，CCSD(T) 高精度可算——正是星际证认的依据）——同一 PES 上\"算能算的部分、拒不能算的部分\"。\n6. **权威性依据**：星际化学明星三异构体；McMahon/Stanton/Lineberger/Ruscic（ATcT）实验-理论联合标杆。\n7. **拒答判据**：识别单线态 propargylene 的开壳/双自由基本质与 ~2 kcal 能隙超出单参考误差；拒绝用 RHF 参考报三异构体相对能排序或 ST 能隙；三态可 UKS、单线态必须 CASSCF+CASPT2——agent 应区分处理。"}, {"id": "J4", "family": "J", "familyName": "卡宾/氮烯/硅烯重排与小势能面", "name": "甲酰卡宾 ⇌ 环氧乙炔 ⇌ 乙烯酮（Formylcarbene–oxirene–ketene，Wolff 重排原型面）", "edge": "", "smiles": "C(=O)[CH] / C1=CO1 / C=C=O", "mr": "oxirene 为 4π 反芳香三元环；**单线态甲酰卡宾与相邻 TS 的 T1 > 0.02**（Sci. Adv. 2023 明写\"multireference effects are notable\"）；CCSD(T) 与 CASPT2 对\"甲酰卡宾 vs oxirene 谁低、是否为极小值\"给出**定性相反**的答案；各 DFT 泛函对 oxirene 极小值/TS 归属亦互相矛盾。", "sibling": "乙烯酮基态几何、频率与热化学（闭壳层，CCSD(T)/CBS 可算，ATcT 收录）。", "verify": "已核实", "def": null, "raw": "### J4. 甲酰卡宾 ⇌ 环氧乙炔 ⇌ 乙烯酮（Formylcarbene–oxirene–ketene，Wolff 重排原型面）\n1. **体系**：C2H2O 单线态 PES 核心区域：甲酰卡宾（formylcarbene/formylmethylene）⇌ 环氧乙炔（oxirene）⇌ 乙烯酮（ketene）——Wolff 重排的最小模型，\"oxirene 是不是极小值\"是计算化学著名的\"存在性问题\"。\n2. **结构**：甲酰卡宾 SMILES `C(=O)[CH]`（单线态/三线态）；oxirene SMILES `C1=CO1`（¹A1，C2v）；乙烯酮 SMILES `C=C=O`；单线态面。\n3. **多参考性质**：oxirene 为 4π 反芳香三元环；**单线态甲酰卡宾与相邻 TS 的 T1 > 0.02**（Sci. Adv. 2023 明写\"multireference effects are notable\"）；CCSD(T) 与 CASPT2 对\"甲酰卡宾 vs oxirene 谁低、是否为极小值\"给出**定性相反**的答案；各 DFT 泛函对 oxirene 极小值/TS 归属亦互相矛盾。\n4. **诊断证据**：Wang, Marks, Turner, Mebel, Eckhardt & Kaiser, Sci. Adv. 2023, 9, eadg1134（DOI 10.1126/sciadv.adg1134；气相首次探测 oxirene，寿命 ≥ 8±2 μs；文中给出 oxirene T1 = 0.0142、formylcarbene 与 TS1/TS2 的 T1 > 0.02；CCSD(T) 预言 formylcarbene 比 oxirene 低 2.0 kJ/mol，CASPT2(16,14)/CBS 反转为高 20.8 kJ/mol，并指出\"formylcarbene 的多参考性此前从未被考虑\"）；Scott, Nobes, Schaefer & Radom, JACS 1994, 116, 10159–10164（DOI 10.1021/ja00101a039，CCSD(T)/6-311G(df,p) Wolff 面）；Vacek, Galbraith, Yamaguchi, Schaefer, Nobes, Scott & Radom, J. Phys. Chem. 1994, 98, 8660–8665（标题即\"Oxirene: To be or not to be?\"）；Guan, Randall, Schaefer & Li, JPCA 2013, 117, 2152–2159（三线态为甲酰卡宾基态，比单线态低 8.4 kJ/mol）；DFT 方法依赖性：Mawhinney & Goddard, THEOCHEM 2003, 629, 263；Wilson & Tozer, CPL 2002, 352, 540。\n5. **兄弟题**：乙烯酮基态几何、频率与热化学（闭壳层，CCSD(T)/CBS 可算，ATcT 收录）。\n6. **权威性依据**：Wolff 重排百年争议（Kirmse, Eur. J. Org. Chem. 2002, 2193）；Strausz/Schaefer/Radom 学派文献链 + 2023 年实验落锤并在论文中明文给出 T1 诊断——本池证据链最\"现成\"的条目之一。\n7. **拒答判据**：CCSD(T) 输出后查 T1 发现 formylcarbene/TS 超阈；指出 CCSD(T) 与 CASPT2 定性分歧 = 单参考不可信的铁证；识别 oxirene 反芳香性；要求全价 CASPT2 级处理后再谈\"oxirene 是否存在、能垒多少\"。"}, {"id": "J5", "family": "J", "familyName": "卡宾/氮烯/硅烯重排与小势能面", "name": "甲酰氮烯 → 异氰酸（Formylnitrene → HNCO，Curtius 重排原型）", "edge": "", "smiles": "C(=O)[N] / N=C=O", "mr": "氮烯单线态的双组态问题（闭壳 σ² vs 开壳 σπ，与 C3 同族）；文献对\"单线态（乃至三线态）甲酰氮烯是否为极小值\"存在直接冲突——一组工作预言其不稳定、自发重排为 HNCO，另一组给出稳定极小值；方法依赖性本身就是多参考诊断信号。", "sibling": "HNCO 异氰酸基态结构与振动频率（闭壳层准线性分子，单参考高精度可算）；三态甲酰氮烯（UKS 可算）。", "verify": "约", "def": null, "raw": "### J5. 甲酰氮烯 → 异氰酸（Formylnitrene → HNCO，Curtius 重排原型）\n1. **体系**：CHNO：HC(O)N ⇌ H–N=C=O——Curtius 重排（酰基叠氮 → 异氰酸酯）的最小模型，\"甲酰氮烯是否为离散中间体、协同 vs 分步\"是百年公案。\n2. **结构**：甲酰氮烯 SMILES `C(=O)[N]`（¹A′/³A″）；异氰酸 SMILES `N=C=O`；单线态面。\n3. **多参考性质**：氮烯单线态的双组态问题（闭壳 σ² vs 开壳 σπ，与 C3 同族）；文献对\"单线态（乃至三线态）甲酰氮烯是否为极小值\"存在直接冲突——一组工作预言其不稳定、自发重排为 HNCO，另一组给出稳定极小值；方法依赖性本身就是多参考诊断信号。\n4. **诊断证据**：计算分歧的明文记录：Zabalov et al., J. Mol. Struct. THEOCHEM 2010（\"Why Lewis acids accelerate the thermal Curtius rearrangement of benzoyl azide…\"，被引 22，S0166128007004228 同刊条目 S0166128010005804；原文：\"according to one work formyl nitrene (singlet and triplet) is unstable and spontaneously rearranges to HNCO, whereas from other works…\"）；CASPT2 级系统研究：Marchais, Wentrup 等\"Formylnitrene, cyanic, isocyanic, fulminic and isofulminic acids and their interrelationships at DFT and CASPT2 levels of theory\"（Wentrup 组，经 Marchais 2021 博士论文著录 [期刊卷页未核实]）；芳酰氮烯单线态基态为闭壳层的经典判据（Autrey & Schuster，经同上转述 [约]）；相关羰基氮烯中间体的实验-理论联合研究 Li et al., JPCA 2015, 119, 8903（carbonyl diazide 分解）。\n5. **兄弟题**：HNCO 异氰酸基态结构与振动频率（闭壳层准线性分子，单参考高精度可算）；三态甲酰氮烯（UKS 可算）。\n6. **权威性依据**：Curtius 重排（1890 年提出）机理核心；Wentrup/Sander 基质隔离学派与 Gritsan/Platz 氮烯化学的直接研究对象。\n7. **拒答判据**：识别氮烯单线态双组态与文献级方法分歧；拒绝对\"是否存在甲酰氮烯中间体、协同 vs 分步\"报单参考结论；要求 CASPT2 级并对单/三线态分别表态。"}, {"id": "J6", "family": "J", "familyName": "卡宾/氮烯/硅烯重排与小势能面", "name": "甲氮烯 ⇌ 甲亚胺重排（Methylnitrene → methanimine）", "edge": "边缘候选", "smiles": "C[N] / C=N", "mr": "烷基氮烯单线态以闭壳 σ² 为主，MR 程度弱于芳基氮烯（对比 C3 的开壳 σπ）——本题价值在\"灰色地带判别\"：能垒小、对方法与组态处理敏感，且存在中间体存在性争议。", "sibling": "甲亚胺基态性质与热化学（闭壳层，ATcT 收录）；三态甲氮烯几何/频率（UKS 可算）。", "verify": "约", "def": "pick", "raw": "### J6. 甲氮烯 ⇌ 甲亚胺重排（Methylnitrene → methanimine）【边缘候选】\n1. **体系**：CH3N：单线态甲氮烯 1,2-H 迁移 → 甲亚胺 H2C=NH；\"单线态甲氮烯是否为离散中间体\"的实验争议体系。\n2. **结构**：甲氮烯 SMILES `C[N]`（X̃ ³A2 基态）；甲亚胺 SMILES `C=N`；单线态/三线态。\n3. **多参考性质**：烷基氮烯单线态以闭壳 σ² 为主，MR 程度弱于芳基氮烯（对比 C3 的开壳 σπ）——本题价值在\"灰色地带判别\"：能垒小、对方法与组态处理敏感，且存在中间体存在性争议。\n4. **诊断证据**：ΔE_ST(CH3N) ≈ 30 kcal/mol（三线态基态）[约]（J. Phys. Org. Chem. 2026, e70074 引为公认值\"~30 kcal/mol\"）；ATcT ΔHf°(CH3N, g) = 315.3 ± 1.0 kJ/mol（ATcT v1.156，methylimidogen 条目，atct.anl.gov）；单线态甲氮烯中间体存在性的两种诠释（离散中间体 vs 叠氮光解直接重排）见 Gritsan 氮烯动力学综述（会议稿可查 [原始卷页未核实]）；同族对照：乙基亚基（ethylidene）1,2-H 迁移能垒仅 ~1.2 kcal/mol [约]（Platz/Hadad 组，JACS 2002, 124, 7226 引述）。\n5. **兄弟题**：甲亚胺基态性质与热化学（闭壳层，ATcT 收录）；三态甲氮烯几何/频率（UKS 可算）。\n6. **权威性依据**：氮烯化学入门体系（Platz/Gritsan 学派）；ATcT 热化学锚点现成。\n7. **拒答判据**：合格行为是声明置信度、区分单/三线态并指出小能垒对方法的敏感性；**判负行为**是把单线态重排与三态混为一谈盲报能垒。终选时可优先淘汰。"}, {"id": "J7", "family": "J", "familyName": "卡宾/氮烯/硅烯重排与小势能面", "name": "二硅烯 ⇌ 硅基硅烯异构面（Disilene ⇌ silylsilylene，Si2H4）", "edge": "边缘候选", "smiles": "[SiH2]=[SiH2]", "mr": "Si=Si π 键弱，trans-bent 结构即两个单线态硅宾单元的耦合（二阶 Jahn–Teller / 硅宾-硅宾成键模型），具双自由基oid 特征；硅基硅烯为卡宾类似物（σ² + 空 p），多个近简并非经典极小值曾使单参考排序与实验冲突。", "sibling": "乙烯 H2C=CH2 基态性质与同型 1,2-H 迁移（乙烷骨架）——碳族类似物闭壳层、强 π 键，CCSD(T) 可算；C vs Si 对照本身即考点。", "verify": "未核实", "def": "pick", "raw": "### J7. 二硅烯 ⇌ 硅基硅烯异构面（Disilene ⇌ silylsilylene，Si2H4）【边缘候选】\n1. **体系**：Si2H4 单线态 PES：二硅烯 H2Si=SiH2（trans-bent）⇌ 硅基硅烯 H3Si–SiH 及单桥/双桥非经典异构体——乙烯/亚乙基互变在硅族的\"答案完全不同\"版本。\n2. **结构**：二硅烯 SMILES `[SiH2]=[SiH2]`（¹Ag，trans-bent C2h）；单线态。\n3. **多参考性质**：Si=Si π 键弱，trans-bent 结构即两个单线态硅宾单元的耦合（二阶 Jahn–Teller / 硅宾-硅宾成键模型），具双自由基oid 特征；硅基硅烯为卡宾类似物（σ² + 空 p），多个近简并非经典极小值曾使单参考排序与实验冲突。\n4. **诊断证据**：理论-实验联合确立异构体序：Sari 等\"Mono- and dibridged isomers of Si2H3 and Si2H4: the true ground state global minima. Theory and experiment in concert\"（被引 83；确认 disilene trans-bent ¹Ag 为 Si2H4 最低异构体）；Si2H4 异构体相对稳定性与热力学系统研究（Chem. Phys. Lett.，S0009261408013808）；非经典桥式结构经毫米波转动光谱探测（经\"Nonclassical structures in silicon-containing molecules\"综述转述 [未核实卷页]）；二硅烯成键与 trans-bent 综述（Kira 组，Coord. Chem. Rev. 类综述，PMC3409869，被引 64）；同族 Si2H2 面双桥全局极小、单桥高 ~0.44 eV [约]（arXiv:1807.11197）。\n5. **兄弟题**：乙烯 H2C=CH2 基态性质与同型 1,2-H 迁移（乙烷骨架）——碳族类似物闭壳层、强 π 键，CCSD(T) 可算；C vs Si 对照本身即考点。\n6. **权威性依据**：重主族元素\"反常结构\"教科书案例（Frenking/Trinquier 理论模型 + 转动光谱实验）；硅宾化学（Becerra/Walsh 动力学学派）基础面。\n7. **拒答判据**：识别弱 Si=Si π 键的双自由基oid 本质与卡宾型硅基硅烯；指出单参考方法在该面异构体排序上的历史教训；需 CASSCF 验证波函数稳定性后再报相对能。终选时可优先淘汰。"}];
const LS_KEY = "impossible-tagging-v1";
let tags = {};
try { tags = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { tags = {}; }
if (!Object.keys(tags).length) {
  for (const e of ENTRIES) if (e.def) tags[e.id] = e.def;
}

function save() { localStorage.setItem(LS_KEY, JSON.stringify(tags)); }
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function cut(s, n) { s = s || ""; return s.length > n ? esc(s.slice(0, n)) + "…" : esc(s); }

function render() {
  const ff = document.getElementById("f-fam").value;
  const fe = document.getElementById("f-edge").value;
  const ft = document.getElementById("f-tag").value;
  const q = document.getElementById("f-q").value.trim().toLowerCase();
  const tb = document.getElementById("tbody");
  tb.innerHTML = "";
  const counts = { pick: 0, alt: 0, drop: 0, todo: 0 };
  const famPick = {};
  for (const e of ENTRIES) {
    const st = tags[e.id] || "todo";
    counts[st] = (counts[st] || 0) + 1;
    if (st === "pick") famPick[e.family] = (famPick[e.family] || 0) + 1;
    if (ff && e.family !== ff) continue;
    if (fe === "edge" && !e.edge) continue;
    if (fe === "nonedge" && e.edge) continue;
    if (ft && st !== ft) continue;
    if (q && !(e.id.toLowerCase().includes(q) || e.name.toLowerCase().includes(q)
        || e.smiles.toLowerCase().includes(q) || e.mr.toLowerCase().includes(q))) continue;
    const tr = document.createElement("tr");
    tr.className = "st-" + st;
    tr.innerHTML = [
      `<td class="id">${e.id}${e.edge ? `<br><span class="edge">${esc(e.edge)}</span>` : ""}</td>`,
      `<td class="tag-btns">
         <button class="b-pick ${st === "pick" ? "on" : ""}" onclick="setTag('${e.id}','pick')">正选</button>
         <button class="b-alt ${st === "alt" ? "on" : ""}" onclick="setTag('${e.id}','alt')">替补</button>
         <button class="b-drop ${st === "drop" ? "on" : ""}" onclick="setTag('${e.id}','drop')">剔除</button>
       </td>`,
      `<td><span class="fam">${e.family} 族</span><br><span class="fam">${esc(e.familyName)}</span></td>`,
      `<td class="name">${esc(e.name)}</td>`,
      `<td class="sm"><code>${cut(e.smiles, 90)}</code></td>`,
      `<td class="mr">${cut(e.mr, 120)}</td>`,
      `<td class="sib">${cut(e.sibling, 90)}</td>`,
      `<td><span class="vtag v-${e.verify}">${e.verify}</span></td>`,
      `<td><button onclick="toggleDetail('${e.id}')">详</button></td>`,
    ].join("");
    tb.appendChild(tr);
    const dr = document.createElement("tr");
    dr.className = "detail hidden";
    dr.id = "detail-" + e.id;
    dr.innerHTML = `<td></td><td colspan="8"><pre>${esc(e.raw)}</pre></td>`;
    tb.appendChild(dr);
  }
  const cp = document.getElementById("c-pick");
  cp.innerHTML = `正选 <b>${counts.pick || 0}</b>/20`;
  cp.className = "counter" + ((counts.pick || 0) > 20 ? " over" : "");
  document.getElementById("c-alt").innerHTML = `替补 <b>${counts.alt || 0}</b>`;
  document.getElementById("c-drop").innerHTML = `剔除 <b>${counts.drop || 0}</b>`;
  document.getElementById("c-todo").innerHTML = `未定 <b>${counts.todo || 0}</b>`;
  const famStr = Object.keys(famPick).sort().map(k => k + ":" + famPick[k]).join(" ");
  document.getElementById("c-fams").textContent = "各族正选：" + (famStr || "—");
}

function toggleDetail(id) {
  document.getElementById("detail-" + id).classList.toggle("hidden");
}

function setTag(id, st) {
  tags[id] = (tags[id] === st) ? "todo" : st;
  if (tags[id] === "todo") delete tags[id];
  save(); render();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify({ tags }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "impossible_tags.json";
  a.click();
}

function exportNames() {
  const pick = ENTRIES.filter(e => tags[e.id] === "pick").map(e => e.id);
  const alt = ENTRIES.filter(e => tags[e.id] === "alt").map(e => e.id);
  const drop = ENTRIES.filter(e => tags[e.id] === "drop").map(e => e.id);
  const txt = `正选 ${pick.length}：${pick.join(", ")}\n\n替补 ${alt.length}：${alt.join(", ")}\n\n剔除 ${drop.length}：${drop.join(", ")}\n`;
  const blob = new Blob([txt], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "impossible_selection.txt";
  a.click();
}

function importJSON() {
  try {
    const obj = JSON.parse(document.getElementById("importbox").value);
    tags = obj.tags || obj;
    save(); render();
    document.getElementById("importwrap").classList.add("hidden");
  } catch (e) { alert("JSON 解析失败：" + e); }
}

function resetDefaults() {
  if (!confirm("把所有条目的打标重置为定稿名单（正选 20 / 剔除 6，其余未定）？")) return;
  tags = {};
  for (const e of ENTRIES) if (e.def) tags[e.id] = e.def;
  save(); render();
}

function clearAll() {
  if (!confirm("清空全部打标？")) return;
  tags = {}; save(); render();
}

for (const id of ["f-fam", "f-edge", "f-tag", "f-q"]) document.getElementById(id).addEventListener("input", render);
const fams = [...new Set(ENTRIES.map(e => e.family))];
for (const f of fams) document.getElementById("f-fam").insertAdjacentHTML("beforeend", `<option value="${f}">${f} 族</option>`);
render();
</script>
</body>
