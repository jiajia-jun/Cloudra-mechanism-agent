name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    # 任何测试挂起时 15 分钟快速失败，而不是空烧默认 6 小时
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run ruff
        run: ruff check cloudra

      - name: Run tests
        # faulthandler_timeout：单测超过 5 分钟自动 dump 所有线程堆栈，便于定位挂起
        # 覆盖率只在 3.11 这一格出：coverage 的 tracer 在 3.12 上对解析型用例慢
        # 3~4 倍（本机同一 venv：3.11 1m50s / 3.12 6m44s，去掉 --cov 则两版都
        # ~2min；COVERAGE_CORE=ctrace 无效），三格都出覆盖率会让 3.12 顶破 job
        # 超时。覆盖数字与解释器版本无关，出一格即可。
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pytest tests -q --cov=cloudra --cov-report=term-missing -o faulthandler_timeout=300
          else
            pytest tests -q -o faulthandler_timeout=300
          fi

      - name: Check imports
        run: |
          python -c "import cloudra; print(cloudra.__version__)"
          python -c "from cloudra import cli, runtime"
          python -c "from cloudra.core import agent"
          python -c "from cloudra.services import api_v2, session_store, nodes"
          python -c "from cloudra.persistence import database"
          python -c "from cloudra.core import message_history"
          python -c "from cloudra.base import session_class, tools_class"
          python -c "from cloudra.infra import config, flocks, logging_setup, llm_client"
          python -c "import cloudra.runtime_v2.schemas, cloudra.runtime_v2.core, cloudra.runtime_v2.commands, cloudra.runtime_v2.agent_host, cloudra.runtime_v2.apply, cloudra.runtime_v2.effects"
          python -c "import cloudra.dag.models, cloudra.dag.store, cloudra.dag.engine, cloudra.dag.controller"
          python -c "import cloudra.scheduler.daemon, cloudra.services.compute_store, cloudra.knowledge.health"

  # JS 宿主是默认调用协议（invocation_protocol=javascript），必须真跑，否则该协议
  # 在 CI 里等于没有门禁。刻意独立成 job 而不是塞进上面的矩阵：宿主用例每个都要
  # spawn 真实 node（QuickJS-WASM），比纯 Python 用例慢一个量级，乘上三个 Python
  # 版本会直接顶破 job 超时；这里只跑一遍 node 22 + 宿主依赖。
  # 同时装 rdkit（chem extra 的第一项）：qm_input_writer 的首道前置检查就是 RDKit，
  # 缺它则 JS 全链路用例只会空跑，装它才覆盖 writer → submit → query → parser。
  js-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] "rdkit>=2023.0"
          npm ci --prefix cloudra/runtime_v2/js_host --ignore-scripts --no-audit --no-fund

      - name: Run the JS host's own tests
        run: npm --prefix cloudra/runtime_v2/js_host test

      - name: Run the host-dependent test suites
        run: |
          pytest -q -o faulthandler_timeout=300 --junitxml=/tmp/js-host-junit.xml \
            tests/test_benchmark_sandbox_fp.py \
            tests/test_runtime_v2_js_runtime.py \
            tests/test_runtime_v2_js_pipeline.py \
            tests/test_runtime_v2_js_acceptance.py \
            tests/test_runtime_v2_dag_submission.py \
            tests/test_runtime_v2_supervisor_tools.py

      - name: Fail if the host suites skipped for missing dependencies
        # 宿主依赖装好了就不许因缺依赖 skip：那说明探测逻辑与环境脱节，门禁是假的
        run: python scripts/check_js_host_gate.py /tmp/js-host-junit.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
