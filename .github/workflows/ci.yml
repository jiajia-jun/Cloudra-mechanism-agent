name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    # 任何测试挂起时 15 分钟快速失败，而不是空烧默认 6 小时
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install ruff

      - name: Run ruff
        run: ruff check cloudra

      - name: Run tests
        # faulthandler_timeout：单测超过 5 分钟自动 dump 所有线程堆栈，便于定位挂起
        run: pytest tests -q --cov=cloudra --cov-report=term-missing -o faulthandler_timeout=300

      - name: Check imports
        run: |
          python -c "import cloudra; print(cloudra.__version__)"
          python -c "from cloudra import cli, api, agent, react, context_manager, runtime"
