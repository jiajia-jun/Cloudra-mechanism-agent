name: CI

on:
  # 只列真实存在的分支：上游没有 `main`，写进触发列表是死触发（推送/PR 永远
  # 匹配不到），还会让人以为存在一条 main 线。
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    # RDKit 与 JS 场景启用后，全套测试实测约 19 分钟；保留有限运行预算。
    # 单测超过 300 秒仍由 faulthandler 输出堆栈，不跳过测试或降低覆盖率门槛。
    timeout-minutes: 30
    strategy:
      # 一格挂掉不许取消其余格：fail-fast 会把 3.12/3.13 判成 cancelled，
      # 那样"3.11 挂了"和"三个版本都挂了"在结果页上无法区分。
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudra/runtime_v2/js_host/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Species-evidence tests need RDKit in every supported Python version.
          pip install -e .[dev] rdkit

      - name: Install JS host dependencies
        # Public JS scenario tests must execute their business tools in this matrix.
        run: npm ci --prefix cloudra/runtime_v2/js_host --ignore-scripts --no-audit --no-fund

      - name: Run ruff
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q cloudra tests

      - name: Run tests
        # faulthandler_timeout：单测超过 5 分钟自动 dump 所有线程堆栈，便于定位挂起
        # 覆盖率只在 3.11 这一格出：coverage 的 tracer 在 3.12 上对解析型用例慢
        # 3~4 倍（本机同一 venv：3.11 1m50s / 3.12 6m44s，去掉 --cov 则两版都
        # ~2min；COVERAGE_CORE=ctrace 无效），三格都出覆盖率会让 3.12 顶破 job
        #   超时。覆盖数字与解释器版本无关，出一格即可。
        # --cov-fail-under=65：覆盖率不能只有数字没有下界。65 取自本机 Windows 实测
        #   70%（那台上含 189 例平台失败与 124 skip），Linux 侧只会更高。
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pytest tests -q --cov=cloudra --cov-report=term-missing --cov-fail-under=65 -o faulthandler_timeout=300
          else
            pytest tests -q -o faulthandler_timeout=300
          fi

      - name: Check imports
        run: |
          python -c "import cloudra; print(cloudra.__version__)"
          python -c "from cloudra import cli, runtime"
          python -c "from cloudra.runtime_v2 import roles, tool_catalog, persistence"
          python -c "from cloudra.services import api_v2, session_store, nodes"
          python -c "from cloudra.persistence import database"
          python -c "from cloudra.base import tool_actor"
          python -c "from cloudra.base import session_class, tools_class"
          python -c "from cloudra.infra import config, flocks, logging_setup, llm_client"
          python -c "import cloudra.runtime_v2.schemas, cloudra.runtime_v2.core, cloudra.runtime_v2.commands, cloudra.runtime_v2.agent_host, cloudra.runtime_v2.apply, cloudra.runtime_v2.effects"
          python -c "import cloudra.dag.models, cloudra.dag.store, cloudra.dag.engine, cloudra.dag.controller"
          python -c "import cloudra.scheduler.daemon, cloudra.services.compute_store, cloudra.knowledge.health"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 前端单测脚本用 `node --experimental-strip-types`（Node >= 22.6 才有
          # 该 flag），与 js_host 的 engines >= 22 一致；Node 20 会直接报未知选项。
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Test frontend
        # src/*.test.ts 三个文件都在 npm test 里，改前端逻辑必须让这一格变红
        working-directory: frontend
        run: npm test

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E frontend (mocked API)
        # 不启 Cloudra 后端：page.route stub /api/v2/*，只验按钮/确认框/劫持路由
        working-directory: frontend
        run: npm run test:e2e

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  full-deps:
    # 主 test 矩阵安装 RDKit 和 JS 宿主，覆盖各 Python 版本的物种证据与公开
    # JS 调用链。这一格再补齐其它可选化学依赖（molli/nmrglue/spectrochempy/
    # chemcoord/pyscf）和 pymupdf，让依赖这些工具的用例也实际执行。
    # 不含 visual(pymol-open-source)：需要系统级构建依赖，留给专门的验收环境。
    # 前端 Playwright Chromium 在 frontend job 里装（mocked API E2E），不在本格。
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # js_runtime 的前置探测要求 Node >= 22（见 runtime_v2/js_runtime.py）
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudra/runtime_v2/js_host/package-lock.json

      - name: Install chemistry extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,chem,pdf]

      - name: Install JS host dependencies
        # JS 宿主用例的第二个前置：node_modules/quickjs-emscripten 必须在位
        run: npm ci --prefix cloudra/runtime_v2/js_host --ignore-scripts --no-audit --no-fund

      - name: Run JS host unit tests
        run: npm test --prefix cloudra/runtime_v2/js_host

      - name: Run tests with the full optional-dependency set
        # 与 test 矩阵同一条命令：差别只在依赖装齐，跳过的那批用例真的执行
        run: pytest tests -q -o faulthandler_timeout=300
