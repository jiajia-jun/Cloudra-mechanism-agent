name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    # 任何测试挂起时 15 分钟快速失败，而不是空烧默认 6 小时
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install ruff

      - name: Run ruff
        run: ruff check cloudra

      - name: Run tests
        # faulthandler_timeout：单测超过 5 分钟自动 dump 所有线程堆栈，便于定位挂起
        run: pytest tests -q --cov=cloudra --cov-report=term-missing -o faulthandler_timeout=300

      - name: Check imports
        run: |
          python -c "import cloudra; print(cloudra.__version__)"
          python -c "from cloudra import cli, runtime"
          python -c "from cloudra.core import agent, supervisor"
          python -c "from cloudra.services import api_v2, session_store, nodes"
          python -c "from cloudra.persistence import database, context_manager"
          python -c "from cloudra.base import session_class, tools_class"
          python -c "from cloudra.infra import config, events, llm_client"
          python -c "import cloudra.runtime_v2.schemas, cloudra.runtime_v2.core, cloudra.runtime_v2.commands, cloudra.runtime_v2.agent_host"
          python -c "import cloudra.dag.models, cloudra.dag.store, cloudra.dag.engine, cloudra.dag.controller"
          # 兼容垫片：重排前的老导入路径必须继续可用
          python -c "from cloudra import agent as legacy_agent, supervisor as legacy_supervisor"
