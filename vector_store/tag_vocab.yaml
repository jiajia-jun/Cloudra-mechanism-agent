# chem-kb 知识卡片标签词表（受控词表，人工维护）
#
# 结构：5 个 facet（维度）。domain 由 cards.jsonl 既有 `domain` 字段继承，
# 不参与打标；method / software / problem / error 由 LLM 打标
# （`cloudra knowledge tag build`），并受本词表 id 约束——LLM 提议词表外的
# tag 会进 pending 清单，审核后手工加进来。
#
# 字段约定：
#   id       ASCII snake_case，写进 cards.jsonl 的 tags 字段与 kg_entity_tags 表
#   label    中文规范名（展示用）
#   label_en 英文名（展示用）
#   aliases  别名/同义词（LLM prompt 与确定性签名匹配共用；ASCII 匹配不区分大小写）
#   source   仅 error facet：active=活跃语料挖掘 / archive=归档区仅挖词 /
#            manual=人工经验补充
#
# 匹配语义：error facet 的 aliases 同时用于查询侧报错签名检测
# （knowledge/plugin.py），命中即触发报错优先检索路径。

version: 1

facets:
  # ------------------------------------------------------------------
  # 体系（一级分类）：继承 cards.jsonl 的 domain 字段，此处仅作枚举登记
  # ------------------------------------------------------------------
  domain:
