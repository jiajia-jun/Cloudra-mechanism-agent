    - {id: md_forcefields, label: 分子动力学与力场, label_en: Molecular Dynamics & Force Fields}
    - {id: semiempirical, label: 半经验与构象搜索, label_en: Semi-Empirical Methods & Conformational Search}
    - {id: gaussian_usage, label: Gaussian使用, label_en: Using Gaussian}
    - {id: other_software, label: 其他量化软件, label_en: Other QC Software}
    - {id: visualization, label: 可视化与制图, label_en: Visualization & Plotting}
